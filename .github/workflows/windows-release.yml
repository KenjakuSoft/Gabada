name: Windows Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json

      - name: Create backend virtual environment
        shell: pwsh
        run: py -3.11 -m venv backend/.venv

      - name: Install backend dependencies
        shell: pwsh
        run: |
          backend\.venv\Scripts\python.exe -m pip install --upgrade pip
          backend\.venv\Scripts\python.exe -m pip install -r backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend-web
        run: npm ci

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG
          if (-not [string]::IsNullOrWhiteSpace($version) -and $version.StartsWith("v")) {
            $version = $version.Substring(1)
          }

          if ([string]::IsNullOrWhiteSpace($version)) {
            .\packaging\windows\build_installer.ps1
          } else {
            .\packaging\windows\build_installer.ps1 -AppVersion $version
          }

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = "manual"
          }

          $portableName = "Gabada-$tag-windows-x64.zip"
          $setupName = "GabadaSetup-$tag-windows-x64.exe"

          New-Item -ItemType Directory -Force -Path packaging/windows/output | Out-Null
          Compress-Archive -Path "packaging/windows/dist/Gabada/*" -DestinationPath "packaging/windows/output/$portableName" -Force

          if (!(Test-Path "packaging/windows/output/GabadaSetup.exe")) {
            throw "GabadaSetup.exe was not created."
          }

          Move-Item "packaging/windows/output/GabadaSetup.exe" "packaging/windows/output/$setupName" -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gabada-windows-release
          path: packaging/windows/output/*
          if-no-files-found: error

      - name: Attach assets to GitHub release
        if: ${{ env.RELEASE_TAG != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem packaging/windows/output -File | ForEach-Object {
            gh release upload $env:RELEASE_TAG $_.FullName --clobber
          }
