# Gabada site profiles
#
# Managed by the Selector Lab and Settings editor.
# Match is by hostname. "www." is stripped automatically.
#

["barclays"]

["barclays.lk"]
platform = "generic"
wait_for = ".product-details-area .price-box .price"

["facebook.com"]
platform = "facebook-marketplace"
wait_for = "div[role='main']"

["gamestreet.lk"]
platform = "generic"
wait_for = "h4.price.pull-right > span"
selectors = { image = "div.product_block.item:nth-of-type(1) > div.product_img:nth-of-type(1) > a > img.img-responsive", price = "h4.price.pull-right > span", title = "#ProductView > div > div > div > div > div:nth-child(1) > div.details.col-md-7.Padd_Right > h3" }

["genarc.lk"]
platform = "woocommerce"

["nanotek.lk"]
platform = "cs-cart"

["nastars.com"]
platform = "woocommerce"
wait_for = ".custom-price-container span.woocommerce-Price-amount.amount.sale-price"
selectors = { discounted_price = ".custom-price-container span.woocommerce-Price-amount.amount.sale-price", price = ".custom-price-container span.woocommerce-Price-amount.amount.sale-price", title = "div.elementor-element.elementor-element-5e66fd4" }

["nexxcom.lk"]
platform = "woocommerce"
wait_for = "p.price, .price .amount"

["sense.lk"]
platform = "generic"
wait_for = "#productPrice"
selectors = { image = "button.owl-prev:nth-of-type(1) > img", price = "#productPrice", stock_status = "div.col-md-7.pt-lg-0", title = "h1.fw-600.text-24" }

["store.epicgames.com"]
platform = "generic"
wait_for = "div.css-l24hbj > div.css-1nblg0t > div.css-l24hbj > span.eds_1ypbntd0.eds_1ypbntdc"
selectors = { discounted_price = "div.css-l24hbj > div.css-1nblg0t > div.css-l24hbj > span.eds_1ypbntd0.eds_1ypbntdc", image = "img.css-14zdv02", price = "span.css-4jky3p", stock_status = "div.css-e045x8 > div.css-1ai4mn:nth-of-type(2) > div.css-1xaekgw:nth-of-type(5) > div > button.eds_14hl3lj9.eds_14hl3ljb", title = "h1.eds_1ypbntd0.eds_1ypbntd3" }

["store.playstation.com"]
platform = "generic"
wait_for = "[data-qa=\"mfe-game-title#price\"]"
selectors = { discounted_price = "[data-qa=\"mfe-game-title#price#price-discounted-price\"]", price = "[data-qa=\"mfe-game-title#price#price-base-price\"]", stock_status = "[data-qa=\"mfe-game-title#add-to-cart#cta\"]", title = "[data-qa=\"mfe-game-title#name\"]" }

["xbox.com"]
platform = "generic"
wait_for = "span.Price-module__boldText___\\+XhBG.Price-module__moreText___AyIr\\+"
selectors = { image = "div.ModuleContainer-module__container___54Ni8.ProductDetailsHeader-module__container___txRkH", price = "span.Price-module__boldText___\\+XhBG.Price-module__moreText___AyIr\\+", title = "h1.typography-module__xdsH1___q8GkG" }
