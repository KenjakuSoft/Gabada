# Per-site scrape profiles. See scraper/site_profiles.py for the format and
# matching rules. Edit + save — profiles hot-reload on mtime change.

# redacted-store (WooCommerce + Elementor / JetWooBuilder). The page renders the
# main product price as a single-product <p class="price"> block, but also
# renders a "related products" carousel whose cards use <span class="price">.
# The generic Woo default (.price > .amount) bleeds into that carousel and
# tracks a neighbouring product's price. Pin extraction to the single-product
# <p class="price"> (the Cash/Card price the store actually charges); the
# direct-child fallback covers non-sale products with no <del>/<ins> wrapper.
#
# Note: the native <p class="price"> is rendered display:none (Elementor draws
# the visible price via its own widget), so it is present in the DOM but never
# "visible" — a visibility-gated wait_for on it hangs for the full timeout.
# Anchor wait_for on the always-visible <h1> title instead; extraction reads
# the hidden <p class="price"> via textContent, which does not need visibility.
["redacted-store"]
platform = "woocommerce"
wait_for = "h1"

["redacted-store".selectors]
price = "p.price del .woocommerce-Price-amount, p.price > .woocommerce-Price-amount"
discounted_price = "p.price ins .woocommerce-Price-amount"
