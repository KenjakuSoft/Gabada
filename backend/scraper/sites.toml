# Per-site scrape profiles. See scraper/site_profiles.py for the format and
# matching rules. Edit + save — profiles hot-reload on mtime change.
#
# This file ships empty. Add one block per store domain; subdomains of a
# saved hostname match automatically. Known platforms: cs-cart, woocommerce,
# shopify, magento, prestashop, opencart, bigcommerce, wix, squarespace,
# generic, facebook-marketplace.
#
# Example — pin a platform and wait_for:
#
#   ["big-store.example"]
#   platform = "cs-cart"
#   wait_for = "h1"
#
# Example — pin explicit selectors (Selector Lab writes this shape):
#
#   ["myshop.example"]
#   platform = "woocommerce"
#   wait_for = "h1"
#
#   ["myshop.example".selectors]
#   price = "p.price del .woocommerce-Price-amount, p.price > .woocommerce-Price-amount"
#   discounted_price = "p.price ins .woocommerce-Price-amount"
