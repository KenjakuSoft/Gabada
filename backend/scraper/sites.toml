# Gabada site profiles — edit this file in Notepad to register new shops.
#
# Each table heading is a hostname (no scheme, no path). "www." is stripped
# before matching, so ["example.com"] covers both example.com and
# www.example.com. Subdomain matches walk up the domain suffix
# (shop.a.example.com falls back to a.example.com, then example.com).
#
# Save the file and the scraper reloads automatically — no restart needed.
# Unknown hosts still work: the scraper falls back to auto-detection.
#
# Known platform values:
#   cs-cart, woocommerce, shopify, magento, prestashop, generic
#
# Minimal entry (just pin the platform):
#   ["mystore.com"]
#   platform = "shopify"
#
# Full entry (override selectors too):
#   ["tricky.com"]
#   platform = "generic"
#   wait_for = "#product-price"
#   [tricky.com.selectors]
#   title = "h1.product-title"
#   price = ".price-now"
#   discounted_price = ".price-was"
#   stock_status = ".availability"
#   image = "img.product-main"


# ── Sri Lanka CS-Cart / B2B tech retailers ──────────────────────────────────

["nanotek.lk"]
platform = "cs-cart"

["barclays.lk"]
platform = "cs-cart"


